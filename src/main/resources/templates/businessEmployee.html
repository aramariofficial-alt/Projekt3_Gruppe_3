<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">

    <title>CallDibs</title>

    <link href="../static/styles.css" rel="stylesheet" th:href="@{/styles.css}">
</head>

<body>

<!-- HEADER -->
<header>
    <div class="container">

        <nav class="row">
            <a class="logo" href="index.html" th:href="@{/}">
            </a>
            <span class="logo"></span>
        </nav>

        <div class="section">
            <p class="label"></p>

            <h1>
                Forretningsudvikler
            </h1>

            <p>
                Velkommen. God arbejdslyst
            </p>
        </div>

    </div>
</header>

<!-- HOVEDINDHOLD -->
<main class="container section stack">
    <h2>Bilbestand fordelt på status</h2>
    <table>
        <thead>
        <tr>
            <th>Status</th>
            <th>Antal</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="entry : ${carCountByStatus}">
            <td th:text="${entry.key}"></td>
            <td th:text="${entry.value}"></td>
        </tr>
        </tbody>

        <tfoot>
        <tr>
            <td>I alt</td>
            <td th:text="${totalCars}"></td>
        </tr>
        </tfoot>
    </table>



</main>

</body>

</html>
